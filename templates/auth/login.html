<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · CivicPulse AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/hackathon.css') }}"><style>body{font-family:Inter,system-ui;background:#07111f;color:#f7fbff}.auth{max-width:480px;margin:8vh auto;padding:32px;background:#0d1b2d;border:1px solid rgba(255,255,255,.1);border-radius:24px}.auth h1{font-size:2.4rem}.auth p,.muted{color:#9bb0c8}.field{margin:18px 0}.field label{display:block;margin-bottom:8px}.field input{width:100%;padding:14px;border-radius:12px;border:1px solid #263c53;background:#081522;color:white}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#22d3ee,#60a5fa);font-weight:800;cursor:pointer}.error{padding:10px;border-radius:10px;background:#7f1d1d;margin:8px 0}</style></head><body><div class="auth"><a href="{{ url_for('main.landing') }}">← CivicPulse AI</a><h1>Welcome back</h1><p>Sign in to report and track civic issues.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="error">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><div class="field"><label>Email</label><input type="email" name="email" required autocomplete="email"></div><div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div><label><input type="checkbox" name="remember"> Remember me</label><p><button class="btn" type="submit">Sign in →</button></p></form><p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div></body></html>
